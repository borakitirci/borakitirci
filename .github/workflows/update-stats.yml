name: Update GitHub profile stats

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Check private statistics token
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo 'Missing PROFILE_STATS_TOKEN. Add it in Settings > Secrets and variables > Actions.'
            exit 1
          fi

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=false&border_color=2A2A2A&border_radius=10&bg_color=111111&title_color=FF6B1A&text_color=FAFAFA&icon_color=FF6B1A&include_all_commits=true'
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: 'true'

      - name: Generate programming languages (user + organizations)
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_ORGS: Viora-Software
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          TOP_N: '7'
          OUT: profile/top-langs.svg
        run: python3 scripts/generate_top_langs.py

      - name: Commit generated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo 'Cards unchanged.'
            exit 0
          fi
          git commit -m 'chore(profile): refresh GitHub statistics'
          git push
